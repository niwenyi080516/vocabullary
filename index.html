<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>背单词</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#f2f4f9; --card:#fff; --ink:#151821; --sub:#6c7386; --line:#e8eaf2;
  --accent:#4f6ef7; --accent2:#8a5cf6; --soft:#eef1fe;
  --ok:#0f9d58; --ok-soft:#e7f6ee;
  --warn:#d9880b; --warn-soft:#fdf3e3;
  --bad:#dc4437; --bad-soft:#fdeceb;
  --shadow:0 14px 34px rgba(20,24,40,.09),0 2px 6px rgba(20,24,40,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1116; --card:#181b23; --ink:#eceef6; --sub:#98a0b4; --line:#262a35;
    --soft:#1d2237; --ok-soft:#13291f; --warn-soft:#2a2113; --bad-soft:#2c1615;
    --shadow:0 14px 34px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
  }
}
html,body{margin:0;padding:0}
body{
  min-height:100vh; color:var(--ink); background:var(--bg);
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(900px 520px at 12% -12%,rgba(79,110,247,.13),transparent 62%),radial-gradient(760px 460px at 106% -4%,rgba(138,92,246,.11),transparent 60%);
  background-attachment:fixed;
}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
h1,h2,h3,p{margin:0}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}

/* 顶栏 */
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 18px;max-width:760px;margin:0 auto;
  background:var(--bg); background:color-mix(in srgb,var(--bg) 80%,transparent);
  backdrop-filter:saturate(1.4) blur(14px); -webkit-backdrop-filter:saturate(1.4) blur(14px);
}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.2px}
.logo{
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:15px;font-weight:800;
  box-shadow:0 6px 14px rgba(79,110,247,.35);
}
.topright{display:flex;align-items:center;gap:8px}
.decksel{
  appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:8px 30px 8px 12px;border-radius:11px;font-size:13.5px;max-width:190px;
  background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
.iconbtn{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--card);font-size:16px;display:grid;place-items:center}

/* 首页 */
.hero{
  background:var(--card);border-radius:24px;padding:22px;box-shadow:var(--shadow);
  border:1px solid var(--line);margin-top:6px;
}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.eyebrow{font-size:12.5px;color:var(--sub);letter-spacing:.4px;margin-bottom:8px}
.h-title{font-size:22px;font-weight:750;line-height:1.35}
.h-title b{color:var(--accent);font-size:27px;font-variant-numeric:tabular-nums}
.sub{color:var(--sub);font-size:13.5px;margin-top:7px}
.ring-wrap{position:relative;width:78px;height:78px;flex:none}
.ring{width:78px;height:78px;display:block}
.ring .rg{fill:none;stroke:var(--line);stroke-width:6}
.ring .rf{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .5s ease}
.ring-txt{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--sub)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:15px;font-weight:650;transition:transform .12s ease,opacity .15s}
.btn:active{transform:scale(.985)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 10px 24px rgba(79,110,247,.28)}
.btn.primary:disabled{opacity:.45;box-shadow:none;cursor:default}
.btn.ghost{background:var(--bghost,transparent);border:1px solid var(--line);color:var(--ink)}
.btn.big{width:100%;height:54px;font-size:16px;margin-top:20px}
.btn.wide{width:100%;height:50px;margin-top:16px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;box-shadow:0 4px 14px rgba(20,24,40,.04)}
.tile span{display:block;font-size:12px;color:var(--sub);margin-bottom:5px}
.tile b{font-size:21px;font-variant-numeric:tabular-nums}
.tile i{font-style:normal;font-size:11px;color:var(--sub);margin-left:2px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px 17px;margin-top:10px;box-shadow:0 4px 14px rgba(20,24,40,.04)}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.panel-h b{font-size:13.5px}
.panel-h span{font-size:11.5px;color:var(--sub)}
.fc{display:flex;align-items:flex-end;gap:6px;height:78px}
.fc .d{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%}
.fc .b{width:100%;max-width:26px;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--accent),var(--accent2));min-height:3px;transition:height .3s}
.fc .b.zero{background:var(--line)}
.fc .n{font-size:10px;color:var(--sub);font-variant-numeric:tabular-nums}
.fc .l{font-size:10.5px;color:var(--sub)}
.spk.xs{width:24px;height:24px;font-size:11px;vertical-align:middle;margin-left:4px}
.fc-note{font-size:10.5px;color:var(--sub);margin-top:11px;line-height:1.5;text-align:center}
.act{
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 10px;
  display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--ink);
  box-shadow:0 4px 14px rgba(20,24,40,.04);
}
.act em{font-style:normal;font-size:19px;line-height:1}
.empty{padding:26px 4px;text-align:center}

/* 学习 */
.pad{padding-bottom:40px}
.study-bar{display:flex;align-items:center;gap:12px;padding:10px 2px 16px}
.link{font-size:13.5px;color:var(--sub);padding:6px 2px}
.pbar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s ease}
.tiny{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.flash{
  background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);
  min-height:330px;padding:28px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;cursor:pointer;user-select:none;
}
.fw{font-family:Georgia,"Times New Roman",serif;font-size:clamp(34px,9vw,52px);font-weight:600;letter-spacing:.5px;word-break:break-word;line-height:1.15}
.fp{color:var(--accent);font-size:15px;margin-top:10px;display:flex;align-items:center;gap:8px;justify-content:center}
.ptag{font-size:11.5px;font-weight:700;color:var(--accent);background:var(--soft);border-radius:5px;padding:2px 7px;line-height:1.5;letter-spacing:.2px;font-style:normal}
.spk{border:1px solid var(--line);border-radius:99px;width:30px;height:30px;display:grid;place-items:center;font-size:13px;background:var(--card)}
.ox{
  font-size:11.5px;color:var(--sub);text-decoration:none;border:1px solid var(--line);
  border-radius:99px;padding:4px 9px;line-height:1;background:var(--card);white-space:nowrap;
}
.ox:hover{color:var(--accent);border-color:var(--accent)}
.hint{color:var(--sub);font-size:13px;margin-top:26px;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.fm{margin-top:8px;animation:fadeUp .22s ease both;width:100%}
.pos{font-size:16.5px;font-weight:500;color:var(--ink);padding:0 4px;line-height:1.65;max-width:520px}
.ex{color:var(--sub);font-size:14px;line-height:1.6;margin-top:14px;padding:0 4px;font-style:italic;max-width:520px}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.rate-btn{
  border-radius:16px;padding:14px 6px;font-size:14.5px;font-weight:650;display:flex;flex-direction:column;align-items:center;gap:4px;
  border:1px solid var(--line);transition:transform .12s ease;
}
.rate-btn:active{transform:scale(.97)}
.rate-btn kbd{font-family:inherit;font-size:10.5px;font-weight:600;opacity:.55;border:1px solid currentColor;border-radius:5px;padding:0 4px;line-height:1.4}
.rate-btn.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.rate-btn.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.rate-btn.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.kbd-hint{text-align:center;color:var(--sub);font-size:11.5px;margin-top:16px;opacity:.8}
.done{text-align:center;padding:40px 10px}
.emoji{font-size:44px;line-height:1}
.done h2{margin-top:14px;font-size:21px}
.done .sub{margin-top:8px}

/* 测验 */
.q-card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:26px 20px;text-align:center;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.q-word{font-family:Georgia,serif;font-size:clamp(30px,8vw,42px);font-weight:600}
.q-mean{font-size:16.5px;font-weight:550;padding:0 6px;line-height:1.6;max-width:480px;margin:0 auto}
.q-ask{color:var(--sub);font-size:13px;margin-top:4px}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.opt{
  text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);
  font-size:14.5px;line-height:1.45;transition:background .15s,border-color .15s;
}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:650}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}

/* 统计 */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px 16px;box-shadow:0 4px 14px rgba(20,24,40,.04)}
.stat span{display:block;font-size:12px;color:var(--sub);margin-bottom:6px}
.stat b{font-size:24px;font-variant-numeric:tabular-nums}
.chart{display:flex;align-items:flex-end;gap:8px;height:118px;margin-top:18px}
.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar{width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--accent),var(--accent2));min-height:3px;transition:height .4s ease}
.bar.zero{background:var(--line)}
.bar-d{font-size:10.5px;color:var(--sub)}
.bar-v{font-size:10px;color:var(--sub);font-variant-numeric:tabular-nums}
.section{margin-top:24px}
.section h3{font-size:14px;font-weight:700;margin-bottom:10px}
.deckrow{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 15px;margin-bottom:8px}
.deckrow .dr-top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:9px}
.deckrow .dr-top span{color:var(--sub);font-size:12px}
.mini-bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.mini-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}

/* 弹层 */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,12,18,.45);display:flex;align-items:flex-end;justify-content:center;padding:0;backdrop-filter:blur(3px)}
@media(min-width:560px){.modal{align-items:center;padding:24px}}
.sheet{
  background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:22px 20px 26px;
  max-height:88vh;overflow:auto;animation:sheetUp .24s ease both;
}
@media(min-width:560px){.sheet{border-radius:22px}}
@keyframes sheetUp{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{font-size:17px;margin-bottom:6px}
.sheet .sub{font-size:12.5px;line-height:1.7}
.sheet code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 5px;margin:2px 0;overflow-wrap:anywhere;display:inline-block;max-width:100%;vertical-align:top}
textarea{
  width:100%;min-height:170px;margin-top:13px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;line-height:1.7;resize:vertical;
}
.sheet-actions{display:flex;gap:10px;margin-top:16px}
.sheet-actions .btn{flex:1;height:48px}
.field{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.field:last-of-type{border-bottom:0}
.field label{font-size:14px}
.field .sub{font-size:12px;margin-top:3px}
input[type=range]{width:130px;accent-color:var(--accent)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.danger{color:var(--bad);border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-size:13px}
.toast{
  position:fixed;left:50%;bottom:calc(34px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:99;
  background:rgba(24,27,35,.94);color:#fff;padding:11px 18px;border-radius:99px;font-size:13.5px;
  box-shadow:0 10px 26px rgba(0,0,0,.28);animation:fadeUp .2s ease both;max-width:82vw;text-align:center;
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px;
}
.toast .undo{
  margin-left:8px;padding:4px 12px;border-radius:99px;border:1px solid rgba(255,255,255,.45);
  font-weight:700;font-size:12.5px;color:#fff;background:rgba(255,255,255,.16);white-space:nowrap;
}
.toast .undo:active{transform:scale(.96)}

/* 词表管理 */
.wrows{max-height:50vh;overflow:auto;margin-top:12px;border-top:1px solid var(--line)}
.wrow{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.wrow b{font-size:14px;font-weight:650;flex:none;min-width:80px;max-width:45%;word-break:break-word}
.wrow span{flex:1;font-size:12.5px;color:var(--sub);line-height:1.5}
.wrow .x{
  flex:none;width:28px;height:28px;border-radius:9px;border:1px solid var(--line);
  color:var(--bad);font-size:15px;line-height:1;display:grid;place-items:center;
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="logo">词</span><span>背单词</span></div>
  <div class="topright">
    <select id="deckSel" class="decksel" aria-label="词书"></select>
    <button class="iconbtn" data-act="settings" aria-label="设置">⚙</button>
  </div>
</header>

<main id="main"></main>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';

/* ================= 词库 ================= */
const CET_RAW = `
abandon|/əˈbændən/|to leave somebody or something and never come back; to stop doing something|They had to abandon the plan.|v.
absorb|/əbˈzɔːb/|to take in a liquid, gas or other substance; to take in information|Plants absorb water from the soil.|v.
abstract|/ˈæbstrækt/|based on general ideas rather than on physical things|Beauty is an abstract idea.|adj.
abundant|/əˈbʌndənt/|existing in large quantities; more than enough|The region has abundant rainfall.|adj.
accelerate|/əkˈseləreɪt/|to go faster; to make something happen sooner|The car accelerated smoothly.|v.
access|/ˈækses/|the right or chance to use or see something|Students have free access to the library.|n.
accompany|/əˈkʌmpəni/|to go somewhere with somebody; to happen at the same time as something else|She accompanied me to the station.|v.
accomplish|/əˈkʌmplɪʃ/|to finish something successfully|We accomplished the task on time.|v.
accumulate|/əˈkjuːmjəleɪt/|to gradually increase in number or amount|Dust had accumulated on the shelf.|v.
accurate|/ˈækjərət/|correct and exact in every detail|The report is surprisingly accurate.|adj.
acknowledge|/əkˈnɒlɪdʒ/|to accept that something is true; to say thank you for something|He acknowledged his mistake at once.|v.
acquire|/əˈkwaɪə/|to get something, especially by effort; to learn a skill|She acquired a new skill quickly.|v.
adapt|/əˈdæpt/|to change in order to be suitable in a new situation|It took time to adapt to the climate.|v.
adequate|/ˈædɪkwət/|enough in quantity, or good enough in quality|The room was adequate for two people.|adj.
adjust|/əˈdʒʌst/|to change something slightly; to get used to a new situation|Please adjust the seat height.|v.
adopt|/əˈdɒpt/|to start to use a plan or idea; to take a child into your family|They adopted a new policy last year.|v.
advocate|/ˈædvəkeɪt/|to publicly support an idea or plan|She advocates free education for all.|v.
affect|/əˈfekt/|to produce a change in somebody or something|Noise affects my sleep badly.|v.
afford|/əˈfɔːd/|to have enough money or time for something|I can't afford a new car right now.|v.
alternative|/ɔːlˈtɜːnətɪv/|something you can choose instead of another thing|Is there an alternative plan?|n./adj.
ambitious|/æmˈbɪʃəs/|wanting very much to be successful|She is ambitious and hard-working.|adj.
analyze|/ˈænəlaɪz/|to look at something in detail in order to understand it|Let's analyze the data first.|v.
anticipate|/ænˈtɪsɪpeɪt/|to expect something to happen|We didn't anticipate so many visitors.|v.
apparent|/əˈpærənt/|easy to see or understand; seeming to be true|It was apparent that he was tired.|adj.
appeal|/əˈpiːl/|to attract or interest somebody; to make a serious request|The design appeals to young people.|v./n.
appreciate|/əˈpriːʃieɪt/|to be grateful for something; to understand the value of something|I really appreciate your help.|v.
approach|/əˈprəʊtʃ/|a way of dealing with something; to come near to somebody|We need a completely new approach.|n./v.
appropriate|/əˈprəʊpriət/|suitable or right for a particular situation|Wear appropriate clothes for the weather.|adj.
approve|/əˈpruːv/|to agree officially to something|The board approved the budget.|v.
assess|/əˈses/|to judge the quality or value of something|We need to assess the risk first.|v.
assume|/əˈsjuːm/|to think that something is true without proof|I assume you've read the email.|v.
attach|/əˈtætʃ/|to fasten or join one thing to another|Please attach the file to your reply.|v.
attitude|/ˈætɪtjuːd/|the way you think and feel about something|His attitude changed completely.|n.
attract|/əˈtrækt/|to make somebody like or want something|The show attracted a big crowd.|v.
authority|/ɔːˈθɒrəti/|the power to give orders; an official organization|He is an authority on ancient art.|n.
available|/əˈveɪləbl/|able to be used or bought; free to see somebody|Tickets are still available today.|adj.
aware|/əˈweə/|knowing that something exists or is happening|She was aware of the risk.|adj.
awkward|/ˈɔːkwəd/|making you feel shy or uncomfortable; difficult to use or deal with|There was an awkward silence.|adj.
balance|/ˈbæləns/|a state in which things are equal or steady|Striking a balance is hard.|n./v.
barrier|/ˈbæriə/|something that stops people from doing something or going somewhere|Language can be a big barrier.|n.
benefit|/ˈbenɪfɪt/|an advantage that you get from something|Exercise benefits your health.|n./v.
bias|/ˈbaɪəs/|a feeling for or against somebody that is not fair|The report showed a clear bias.|n.
blame|/bleɪm/|to say that somebody is responsible for something bad|Don't blame others for your mistakes.|v./n.
boost|/buːst/|to make something better, bigger or more successful|The news boosted confidence.|v.
brief|/briːf/|lasting a short time; using only a few words|He gave a brief summary.|adj.
brilliant|/ˈbrɪliənt/|extremely clever or good; very bright in colour or light|What a brilliant idea!|adj.

/* ================= 基础 ================= */
const IV = [0,1,2,4,7,15,30,60,120];
const DAY = 86400000;

const MASTER = 4;

const META = {
  cet:    { name:'四六级 / 考研', icon:'📘' },
  ielts:  { name:'雅思 / 托福',   icon:'📗' },
  ielts5k:{ name:'雅思 5000 核心词', icon:'📕' },
  custom: { name:'我的词表',      icon:'📥' }
};

const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
const pad2 = n => (n < 10 ? '0' : '') + n;
function dkey(d){ d = d || new Date(); return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function parseRaw(raw){
  const out = [], seen = {};
  raw.split('\n').forEach(line => {
    line = line.trim();
    if(!line || line.charAt(0) === '|' || line.indexOf('|') < 0) return;
    const p = line.split('|').map(s => s.trim());
    if(!p[0]) return;
    const key = p[0].toLowerCase();
    if(seen[key]) return;
    seen[key] = 1;
    out.push({ w:p[0], ph:p[1] || '', m:p[2] || '', ex:p[3] || '', pos:p[4] || '' });
  });
  return out;
}
const DECKS = { cet: parseRaw(CET_RAW), ielts: parseRaw(IELTS_RAW), ielts5k: parseRaw(IELTS5K_RAW), custom: [] };

/* ================= 状态 ================= */
function load(){
  const def = { deck:'cet', settings:{ dailyNew:20, autoSpeak:true, ttsRate:0.9 }, custom:[], progress:{}, log:{}, streak:{ last:'', count:0 } };
  try{
    const raw = localStorage.getItem(STORE);
    if(!raw) return def;
    const o = JSON.parse(raw) || {};
    const s = Object.assign(def, o);
    s.settings = Object.assign({ dailyNew:20, autoSpeak:true, ttsRate:0.9 }, o.settings || {});
    s.custom = Array.isArray(o.custom) ? o.custom : [];
    s.progress = o.progress || {};
    s.log = o.log || {};
    s.streak = o.streak || { last:'', count:0 };
    if(!META[s.deck]) s.deck = 'cet';
    DECKS.custom = s.custom;
    const ks = Object.keys(s.log);
    if(ks.length > 120){ ks.sort(); ks.slice(0, ks.length - 120).forEach(kk => { delete s.log[kk]; }); }
    // 旧数据没有 per-deck 计数：把今天的量归到当前词书，避免白送一次新词额度
    const tk = dkey(), tlog = s.log[tk];
    if(tlog && !tlog.decks){ tlog.decks = {}; tlog.decks[s.deck] = { new:tlog.new || 0, review:tlog.review || 0 }; }
    return s;
  }catch(e){ return def; }
}
let S = load();
DECKS.custom = S.custom;   // load() 无存档时会直接返回默认对象,跳过上面的赋值,这里必须补同步
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(S)); }catch(e){} }

const words = () => DECKS[S.deck] || [];
const kkey = w => S.deck + '::' + w;
const rec = w => S.progress[kkey(w)];
function todayLog(){
  const d = dkey();
  if(!S.log[d]) S.log[d] = { ids:{}, new:0, review:0, decks:{} };
  if(!S.log[d].decks) S.log[d].decks = {};
  return S.log[d];
}
function deckToday(id){
  const l = todayLog();
  if(!l.decks[id]) l.decks[id] = { new:0, review:0 };
  return l.decks[id];
}
function touchStreak(){
  const t = dkey();
  if(S.streak.last === t) return;
  S.streak.count = (S.streak.last === dkey(new Date(Date.now() - DAY))) ? S.streak.count + 1 : 1;
  S.streak.last = t;
}

/* ================= 语音 ================= */
let voice = null;
function pickVoice(){
  try{
    const vs = speechSynthesis.getVoices() || [];
    voice = vs.filter(v => /^en/i.test(v.lang)).sort((a, b) => (/US/.test(b.lang) ? 1 : 0) - (/US/.test(a.lang) ? 1 : 0))[0] || null;
  }catch(e){}
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, rate){
  if(!text || !('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = rate || S.settings.ttsRate || 0.9;
    if(voice) u.voice = voice;
    speechSynthesis.speak(u);
  }catch(e){}
}

  }
  const allowNew = Math.max(0, S.settings.dailyNew - dt.new);
  const newTake = Math.min(allowNew, fresh);
  const remain = due + newTake;
  const doneToday = dt.new + dt.review;
  const total = doneToday + remain;
  const pct = total ? doneToday / total : 0;
  const C = 2 * Math.PI * 30;

  let hero;
  if(!list.length){
    hero = `<div class="hero">

        : (learned > 0 ? `<button class="btn primary big" data-act="random">随机复习一组</button>` : '')}
    </div>`;
  }

  const fc = forecastCounts();
  const fcMax = Math.max(1, Math.max.apply(null, fc));
  const WK = '日一二三四五六';
  const fcHtml = fc.map((n, i) => {
    const dd = new Date(Date.now() + i * DAY);
    const label = i === 0 ? '今天' : (i === 1 ? '明天' : '周' + WK.charAt(dd.getDay()));
    const h = Math.max(4, Math.round(n / fcMax * 52));
    return `<div class="d"><span class="n">${n || ''}</span><div class="b ${n ? '' : 'zero'}" style="height:${h}px"></div><span class="l">${label}</span></div>`;
  }).join('');

  $('#main').innerHTML = `<div class="wrap">
    ${hero}
    <div class="tiles">
      <div class="tile"><span>已学</span><b>${learned}</b></div>
      <div class="tile"><span>今日已学</span><b>${doneToday}</b></div>
      <div class="tile"><span>连续打卡</span><b>${S.streak.count}</b><i>天</i></div>
    </div>
    <div class="actions">
      <button class="act" data-act="quiz"><em>🧠</em>测验</button>
      <button class="act" data-act="stats"><em>📊</em>统计</button>
      <button class="act" data-act="import"><em>📥</em>导入词表</button>
    </div>
    ${list.length ? `<div class="panel">
      <div class="panel-h"><b>未来 7 天复习</b><span>艾宾浩斯遗忘曲线</span></div>
      <div class="fc">${fcHtml}</div>
      <p class="fc-note">复习节点:第 1、2、4、7、15、30、60、120 天 · 点「认识」往后推一档</p>
    </div>` : ''}
  </div>`;
}

function forecastCounts(){
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const base = start.getTime();
  const c = [0, 0, 0, 0, 0, 0, 0];
  words().forEach(w => {
    const r = rec(w.w);
    if(!r || r.s === 0 || !r.due) return;
    let idx = Math.floor((r.due - base) / DAY);
    if(idx < 0) idx = 0;
    if(idx < 7) c[idx]++;
  });
  return c;
}

/* ================= 学习 ================= */
function startSession(mode){
  const list = words();
  if(!list.length){ toast('这个词书是空的,先导入些词吧'); return; }
  const now = Date.now();
  const tl = todayLog();
  let queue = [];

  if(mode === 'random'){
    const learned = list.filter(w => { const r = rec(w.w); return r && r.s > 0; });
    if(!learned.length){ toast('还没有学过的词,先学一轮'); return; }
    queue = shuffle(learned.slice()).slice(0, 10).map(w => ({ w:w, isNew:false }));
  }else{
    const due = list.filter(w => {
      const r = rec(w.w);
      return r && r.s > 0 && r.due <= now && !tl.ids[kkey(w.w)];
    });
    const freshAll = list.filter(w => { const r = rec(w.w); return !r || r.s === 0; });
    const allow = Math.max(0, S.settings.dailyNew - deckToday(S.deck).new);
    const pick = shuffle(freshAll.slice()).slice(0, allow);
    queue = shuffle(due.slice()).map(w => ({ w:w, isNew:false })).concat(pick.map(w => ({ w:w, isNew:true })));
    shuffle(queue);
  }

  if(!queue.length){
    toast(mode === 'random' ? '暂时没有可复习的词' : '今天没有要背的词了');
    return;
  }
  sess = { queue:queue, i:0, repeats:{}, right:0, mode:(mode === 'random' ? 'random' : 'scheduled') };
  CUR = 'study';
  window.scrollTo(0, 0);
  renderCard();
}

function renderCard(){
  if(!sess){ CUR = 'home'; renderHome(); return; }
  if(sess.i >= sess.queue.length){ return renderDone(); }
  const item = sess.queue[sess.i];
  const pct = (sess.i / sess.queue.length) * 100;
  const oxUrl = 'https://www.oxfordlearnersdictionaries.com/definition/english/' + encodeURIComponent(item.w.w);
  const ph = `<div class="fp">

      <a class="ox" href="${oxUrl}" target="_blank" rel="noopener noreferrer" data-act="oxford" title="在牛津在线词典里查看">牛津</a>
    </div>`;

  $('#main').innerHTML = `<div class="wrap pad">
    <div class="study-bar">
      <button class="link" data-act="exit">← 退出</button>
      <div class="pbar"><i style="width:${pct.toFixed(1)}%"></i></div>
      <span class="tiny">${sess.i + 1}/${sess.queue.length}</span>
    </div>
    <div class="flash" data-act="reveal">

      <div class="fm" id="fm" hidden>
        <div class="pos">${esc(item.w.m)}<button class="spk xs" data-act="speakDef" aria-label="朗读释义">🔊</button></div>
        ${item.w.ex ? `<div class="ex">${esc(item.w.ex)}<button class="spk xs" data-act="speakEx" aria-label="朗读例句">🔊</button></div>` : ''}
      </div>
    </div>
    <div class="rate" id="rateRow" hidden>
      <button class="rate-btn bad" data-act="grade" data-g="0">不认识<kbd>1</kbd></button>
      <button class="rate-btn warn" data-act="grade" data-g="1">有点模糊<kbd>2</kbd></button>
      <button class="rate-btn ok" data-act="grade" data-g="2">认识<kbd>3</kbd></button>
    </div>
    <p class="kbd-hint">空格 显示释义 · 1 / 2 / 3 评分</p>

function reveal(){
  const fm = $('#fm'), rate = $('#rateRow'), hint = $('#hint');
  if(!fm || !fm.hidden) return;
  fm.hidden = false;
  if(rate) rate.hidden = false;
  if(hint) hint.hidden = true;

function applyGrade(word, g){
  const idx = kkey(word);
  let r = S.progress[idx];
  if(!r){ r = S.progress[idx] = { s:0, due:0, reps:0, lapses:0, last:0 }; }
  const now = Date.now();
  if(g === 2){
    r.s = Math.min(r.s + 1, 8);
    r.due = now + IV[r.s] * DAY;
  }else if(g === 1){
    r.s = Math.max(1, r.s);
    r.due = now + 10 * 3600000;
  }else{
    r.s = 1;
    r.lapses++;
    r.due = now + 10 * 60000;
  }
  r.reps++;
  r.last = now;
  touchStreak();
}

/* 评分可撤销：只对「认识」保留一次快照，3.5 秒内可回退排期与今日计数 */
function offerUndo(o){
  UNDO = o;
  clearTimeout(undoTimer);
  const t = $('#toast');
  t.innerHTML = '认识 · ' + IV[S.progress[o.key].s] + ' 天后再复习' +
    '<button class="undo" data-act="undo">撤销</button>';
  t.hidden = false;
  undoTimer = setTimeout(function(){ t.hidden = true; UNDO = null; }, 3500);
}
function undoGrade(){
  if(!UNDO) return;
  const o = UNDO;
  UNDO = null;
  clearTimeout(undoTimer);
  if(o.snap) S.progress[o.key] = o.snap; else delete S.progress[o.key];
  if(o.logAdded){
    const l = todayLog();
    if(l.ids[o.key]){
      delete l.ids[o.key];
      const dl = deckToday(o.deck);
      if(o.wasNew){ l.new = Math.max(0, l.new - 1); dl.new = Math.max(0, dl.new - 1); }
      else { l.review = Math.max(0, l.review - 1); dl.review = Math.max(0, dl.review - 1); }
    }
  }
  if(o.sess && o.sess.i > 0) o.sess.i--;
  save();
  $('#toast').hidden = true;
  if(o.sess && o.sess === sess){ CUR = 'study'; renderCard(); } else render();
  toast('已撤销');
}

function grade(g){
  if(!sess || sess.i >= sess.queue.length) return;
  const item = sess.queue[sess.i];
  const key = kkey(item.w.w);
  const casual = sess.mode === 'random';   // 随机复习：只看，不改排期
  let snap = null, wasNew = false, logAdded = false;

  if(!casual){
    const before = S.progress[key];
    snap = before ? Object.assign({}, before) : null;
    wasNew = !before || before.s === 0;
    applyGrade(item.w.w, g);
    const l = todayLog();
    if(!l.ids[key]){
      l.ids[key] = 1;
      const dl = deckToday(S.deck);
      if(wasNew){ l.new++; dl.new++; } else { l.review++; dl.review++; }
      logAdded = true;
    }
  }

  const times = sess.repeats[key] || 0;
  if(g === 0 && times < 2){ sess.repeats[key] = times + 1; sess.queue.push({ w:item.w, isNew:false }); }
  else if(g === 1 && times < 1){ sess.repeats[key] = times + 1; sess.queue.push({ w:item.w, isNew:false }); }

  sess.i++;
  save();
  renderCard();

  if(casual) toast(g === 2 ? '记住了' : (g === 1 ? '再看一遍吧' : '这一轮还会再见到它'));
  else if(g === 2) offerUndo({ key:key, snap:snap, wasNew:wasNew, logAdded:logAdded, deck:S.deck, sess:sess });
  else if(g === 1) toast('有点模糊 · 10 小时后再来一次');
  else toast('不认识 · 这一轮还会再碰到');
}

/* ================= 测验 ================= */
function startQuiz(){
  const list = words();
  const learned = list.filter(w => { const r = rec(w.w); return r && r.s >= 1; });
  if(learned.length < 4){ toast('先学满 4 个词,再来测验'); return; }
  const pick = shuffle(learned.slice()).slice(0, 10);
  quiz = {
    items: pick.map(w => ({ w:w, dir: Math.random() < 0.5 ? 'w2m' : 'm2w' })),
    i:0, right:0, picked:null
  };
  CUR = 'quiz';
  window.scrollTo(0, 0);
  renderQuiz();
}

function renderQuiz(){
  if(!quiz){ CUR = 'home'; renderHome(); return; }
  if(quiz.i >= quiz.items.length){
    const total = quiz.items.length;
    const pctv = Math.round(quiz.right / total * 100);
    $('#main').innerHTML = `<div class="wrap pad"><div class="done">
      <div class="emoji">${pctv >= 80 ? '🏆' : (pctv >= 50 ? '👍' : '💪')}</div>
      <h2>测验结束</h2>
      <p class="sub">答对 ${quiz.right} / ${total}</p>
      <div class="sheet-actions" style="margin-top:26px">
        <button class="btn ghost" data-act="home">回首页</button>
        <button class="btn primary" data-act="quizAgain">再来一组</button>
      </div>
    </div></div>`;
    return;
  }

  const item = quiz.items[quiz.i];
  const list = words();
  const keyOf = x => item.dir === 'w2m' ? x.m : x.w;
  const correct = keyOf(item.w);
  const answered = quiz.picked != null;
  // 答题后必须复用同一组选项：重新洗牌会让 picked 下标指向别的选项，标红就落错位置
  let opts = quiz.opts;
  if(!answered || !opts || !opts.length){
    const used = {};
    used[String(correct).toLowerCase()] = 1;
    const others = [];
    const pool = shuffle(list.filter(x => x.w !== item.w.w));
    for(let i = 0; i < pool.length && others.length < 3; i++){
      const k = String(keyOf(pool[i])).toLowerCase();
      if(used[k]) continue;            // 同时去掉与正确答案重复、以及彼此重复的干扰项
      used[k] = 1;
      others.push(pool[i]);
    }
    opts = quiz.opts = shuffle([item.w].concat(others));
  }
  quiz.correct = correct;

  const prompt = item.dir === 'w2m'
    ? `<div class="q-word">${esc(item.w.w)}</div>${(item.w.pos || item.w.ph) ? `<div class="fp">${item.w.pos ? `<span class="ptag">${esc(item.w.pos)}</span>` : ''}${item.w.ph ? esc(item.w.ph) : ''}</div>` : ''}<div class="q-ask">选出正确的释义</div>`
    : `<div class="q-mean">${esc(item.w.m)}</div><div class="q-ask">哪个词是这个意思?</div>`;

  $('#main').innerHTML = `<div class="wrap pad">
    <div class="study-bar">
      <button class="link" data-act="home">← 退出</button>
      <div class="pbar"><i style="width:${(quiz.i / quiz.items.length * 100).toFixed(1)}%"></i></div>
      <span class="tiny">${quiz.i + 1}/${quiz.items.length}</span>
    </div>
    <div class="q-card">${prompt}</div>
    <div class="opts">
      ${opts.map((o, idx) => {
        let cls = 'opt';
        if(answered){
          if(keyOf(o) === correct) cls += ' right';
          else if(idx === quiz.picked) cls += ' wrong';
        }
        return `<button class="${cls}" ${answered ? 'disabled' : ''} data-act="answer" data-i="${idx}">${esc(keyOf(o))}</button>`;
      }).join('')}
    </div>
    ${answered ? `<button class="btn primary wide" data-act="next">${quiz.i + 1 < quiz.items.length ? '下一题' : '看结果'}</button>` : ''}
  </div>`;
}

function renderStats(){

  const days = [];
  for(let i = 6; i >= 0; i--){
    const d = new Date(Date.now() - i * DAY);

    days.push({ label:(d.getMonth()+1) + '/' + d.getDate(), v: l ? (l.new + l.review) : 0 });

  const max = Math.max(1, Math.max.apply(null, days.map(d => d.v)));

  const rows = Object.keys(META).map(id => {
    const dl = DECKS[id] || [];
    let lr = 0;

    <div class="study-bar"><button class="link" data-act="home">← 返回</button><div class="pbar" style="opacity:0"></div><span class="tiny"></span></div>
    <div class="stat-grid">
      <div class="stat"><span>当前词书已学</span><b>${learned}</b></div>
      <div class="stat"><span>已掌握</span><b>${mastered}</b></div>
      <div class="stat"><span>连续打卡</span><b>${S.streak.count}<small style="font-size:13px;color:var(--sub)"> 天</small></b></div>

      </div>

function parseImport(text){
  const out = [];
  text.split(/\r?\n/).forEach(line => {
    line = line.trim();
    if(!line || line.charAt(0) === '#') return;
    let w = '', ph = '', m = '', ex = '', pos = '';
    if(line.indexOf('|') >= 0){
      const p = line.split('|').map(s => s.trim());
      w = p[0] || '';
      const a = p[1] || '', b = p[2] || '', c = p[3] || '', f = p[4] || '';
      if(a.charAt(0) === '/'){ ph = a; m = b; ex = c; pos = f; }
      else { m = a; ph = b; ex = c; pos = f; }
    }else{
      const mm = line.match(/^([A-Za-z][A-Za-z'\u2019\-. ]*?)\s*[,，\t]\s*(.+)$/) ||
                 line.match(/^([A-Za-z][A-Za-z'\u2019\-]*)\s+(.+)$/);
      if(!mm) return;
      w = mm[1].trim(); m = mm[2].trim();
    }
    if(!w || !m) return;
    out.push({ w:w, ph:ph, m:m, ex:ex, pos:pos });
  });
  return out;
}

function doImport(){
  const ta = $('#importText');
  if(!ta) return;
  const rows = parseImport(ta.value);
  if(!rows.length){ toast('没解析出词,检查下格式'); return; }
  const seen = {};
  S.custom.forEach(x => { seen[x.w.toLowerCase()] = 1; });
  let added = 0;
  rows.forEach(r => {
    const lw = r.w.toLowerCase();
    if(seen[lw]) return;
    seen[lw] = 1;
    S.custom.push(r);
    added++;
  });
  save();
  S.deck = 'custom';
  save();
  renderDeckSelect();
  closeModal();
  show('home');
  toast(added ? '导入 ' + added + ' 个词' : '这些词都已经有了');
}

      <div style="display:flex;align-items:center;gap:10px">
        <input type="range" id="ttsRate" min="0.6" max="1.2" step="0.1" value="${S.settings.ttsRate}">
        <b id="ttsRateVal" style="width:28px;text-align:right">${S.settings.ttsRate}</b>
      </div>
    </div>
    <div class="field">
      <div><label>我的词表</label><div class="sub">已导入 ${S.custom.length} 个词,可逐个删除或全部清空</div></div>
      <button class="danger" data-act="customList">管理</button>
    </div>
    <div class="field" style="border-bottom:0">
      <div><label>清空当前词书进度</label><div class="sub">只影响「${esc(META[S.deck].name)}」</div></div>
      <button class="danger" data-act="resetDeck">清空</button>
    </div>
    <div class="sheet-actions">
      <button class="btn ghost" data-act="close">关闭</button>
      <button class="btn primary" data-act="saveSettings">保存</button>
    </div>`);
}

/* ================= 我的词表 ================= */
function modalCustom(){
  const rows = S.custom.map((w, i) => `<div class="wrow">
      <b>${esc(w.w)}</b>
      <span>${esc(w.m || '')}</span>
      <button class="x" data-act="delWord" data-i="${i}" aria-label="删除 ${esc(w.w)}">×</button>
    </div>`).join('');
  openModal(`<h3>我的词表 · ${S.custom.length} 个词</h3>
    <p class="sub">删掉一个词,它在你词表里的学习进度也会一起移除。</p>
    ${S.custom.length ? `<div class="wrows">${rows}</div>` : '<p class="sub" style="margin-top:14px">还没有导入过词,先去「导入词表」加几个。</p>'}
    <div class="sheet-actions">
      ${S.custom.length ? '<button class="danger" style="flex:1" data-act="clearCustom">全部清空</button>' : ''}
      <button class="btn ghost" data-act="close">关闭</button>
    </div>`);
}
function delCustom(i){
  const w = S.custom[i];
  if(!w) return;
  S.custom.splice(i, 1);
  delete S.progress['custom::' + w.w];
  const tl = todayLog();
  delete tl.ids['custom::' + w.w];
  save();
  renderDeckSelect();
  modalCustom();
  toast('已删除 ' + w.w);
}
function clearCustom(){
  const n = S.custom.length;
  if(!n) return;
  if(!confirm('确定清空「我的词表」？' + n + ' 个词会全部移除,学习进度也会一起删除。')) return;
  S.custom.splice(0, S.custom.length);
  const prefix = 'custom::';
  Object.keys(S.progress).forEach(kk => { if(kk.indexOf(prefix) === 0) delete S.progress[kk]; });
  const tl = todayLog();
  Object.keys(tl.ids).forEach(kk => { if(kk.indexOf(prefix) === 0) delete tl.ids[kk]; });
  const dl = tl.decks.custom;
  if(dl){
    tl.new = Math.max(0, tl.new - (dl.new || 0));
    tl.review = Math.max(0, tl.review - (dl.review || 0));
    delete tl.decks.custom;
  }
  save();
  renderDeckSelect();
  closeModal();
  show('home');
  toast('已清空我的词表');
}

/* ================= 事件 ================= */
document.addEventListener('click', function(e){
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  switch(act){
    case 'speak':
      if(sess && sess.i < sess.queue.length) speak(sess.queue[sess.i].w.w);
      break;
    case 'speakDef':
      if(sess && sess.i < sess.queue.length) speak(sess.queue[sess.i].w.m, 0.92);
      break;
    case 'speakEx':
      if(sess && sess.i < sess.queue.length) speak(sess.queue[sess.i].w.ex, 0.88);
      break;
    case 'reveal': reveal(); break;
    case 'grade': grade(parseInt(el.dataset.g, 10)); break;
    case 'start': startSession('scheduled'); break;
    case 'random': startSession('random'); break;
    case 'again': startSession('scheduled'); break;
    case 'quiz': startQuiz(); break;
    case 'quizAgain': startQuiz(); break;
    case 'stats': show('stats'); break;
    case 'home': show('home'); break;
    case 'exit': sess = null; show('home'); break;
    case 'import': modalImport(); break;
    case 'settings': modalSettings(); break;
    case 'close': closeModal(); break;
    case 'undo': undoGrade(); break;
    case 'customList': modalCustom(); break;
    case 'delWord': delCustom(parseInt(el.dataset.i, 10)); break;
    case 'clearCustom': clearCustom(); break;
    case 'doImport': doImport(); break;
    case 'answer': {
      if(!quiz || quiz.picked != null) return;
      const idx = parseInt(el.dataset.i, 10);
      const item = quiz.items[quiz.i];
      const keyOf = x => item.dir === 'w2m' ? x.m : x.w;
      quiz.picked = idx;
      if(keyOf(quiz.opts[idx]) === quiz.correct) quiz.right++;
      renderQuiz();
      break;
    }
    case 'next':
      if(!quiz) return;
      quiz.i++; quiz.picked = null; quiz.opts = null;
      renderQuiz();
      break;
    case 'resetDeck': {
      const deck = S.deck;
      const prefix = deck + '::';
      Object.keys(S.progress).forEach(kk => { if(kk.indexOf(prefix) === 0) delete S.progress[kk]; });
      const tl = todayLog();
      Object.keys(tl.ids).forEach(kk => { if(kk.indexOf(prefix) === 0) delete tl.ids[kk]; });
      const dl = tl.decks[deck];          // 今日计数也要跟着清，否则统计还显示旧数字
      if(dl){
        tl.new = Math.max(0, tl.new - (dl.new || 0));
        tl.review = Math.max(0, tl.review - (dl.review || 0));
        delete tl.decks[deck];
      }
      save(); closeModal(); show('home');
      toast('已清空「' + META[deck].name + '」的进度');
      break;
    }
    case 'saveSettings': {
      const r = $('#dailyNew'), c = $('#autoSpeak'), sp = $('#ttsRate');
      if(r) S.settings.dailyNew = parseInt(r.value, 10) || 20;
      if(c) S.settings.autoSpeak = !!c.checked;
      if(sp) S.settings.ttsRate = parseFloat(sp.value) || 0.9;
      save(); closeModal();
      toast('设置已保存');
      break;
    }
  }
});

document.addEventListener('input', function(e){
  if(!e.target) return;
  if(e.target.id === 'dailyNew'){
    const v = $('#dailyNewVal');
    if(v) v.textContent = e.target.value;
  }
  if(e.target.id === 'ttsRate'){
    const v = $('#ttsRateVal');
    if(v) v.textContent = e.target.value;
  }
});

document.addEventListener('keydown', function(e){
  if((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')){ undoGrade(); return; }
  if(!$('#modal').hidden){
    if(e.key === 'Escape') closeModal();
    return;
  }
  if(CUR === 'study' && sess){
    if(e.code === 'Space'){ e.preventDefault(); reveal(); }
    else if(e.key === '1' || e.key === '2' || e.key === '3'){
      const row = $('#rateRow');           // 学完一轮后 #rateRow 已不存在，不能直接取 .hidden
      if(row && !row.hidden) grade(parseInt(e.key, 10) - 1);
    }
    else if(e.key === 'Escape'){ sess = null; show('home'); }
  }
});

$('#modal').addEventListener('click', function(e){
  if(e.target === this) closeModal();
});

$('#deckSel').addEventListener('change', function(){
  S.deck = this.value;
  save();
  sess = null; quiz = null;
  show('home');
});

/* ================= 启动 ================= */
renderDeckSelect();
show('home');

})();
</script>
</body>
</html>
